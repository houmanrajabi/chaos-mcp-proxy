[project]
name = "chaos-mcp-proxy"
version = "0.1.0"
description = "Fault-injecting MCP proxy for multi-agent LLM robustness testing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3.0",
    "pyyaml>=6.0",
    "anyio>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv]
package = false
