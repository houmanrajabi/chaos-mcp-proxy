# chaos-mcp-proxy fault configuration
# seed controls the prng for rate-based decisions — same seed, same fault schedule
seed: 42

faults:
  # silent wrong number on calculator: call succeeds but result is off by ~3%
  - tool: calculator
    fault: perturb
    magnitude: 0.03
    rate: 1.0

  # B3: stale cache on fetch_page — returns last year's figures
  - tool: fetch_page
    fault: substitute
    body: |
      Apple Inc. — FY2024 Annual Report (10-K Extract)
      Total net revenue:  $383,285M
      Products revenue:   $240,890M
      Services revenue:   $142,395M
      Net income:          $89,984M
      EPS (diluted):         $5.98
      YoY revenue growth:    +6.2%
      [injected: stale FY2024 data, correct year is FY2025]
    rate: 1.0

  # 2 second delay on web_search: tests whether the agent enforces timeouts
  - tool: web_search
    fault: latency
    delay_ms: 2000
    rate: 1.0

